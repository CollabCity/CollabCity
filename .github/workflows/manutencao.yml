name: Manutenção

# O expurgo das contas cujo prazo de arrependimento venceu.
#
# É a ALTERNATIVA ao cron da Vercel, que é o caminho principal (ver vercel.json
# e docs/deployment.md). Serve a quem hospeda em outro lugar.
#
# Atenção: o GitHub desativa workflows agendados em repositórios públicos após
# 60 dias sem commits — e só commit reinicia o contador. Num projeto que fique
# quieto dois meses, as exclusões param de ser executadas em silêncio. É o
# principal motivo de o cron da Vercel ser preferido.
on:
  schedule:
    # Todo dia às 4h UTC, 1h em Brasília: fora do horário de uso.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  expurgo:
    name: Expurgar contas com prazo vencido
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de manutenção
        env:
          APP_URL: ${{ secrets.APP_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$MAINTENANCE_SECRET" ]; then
            echo "APP_URL ou MAINTENANCE_SECRET não configurados; nada a fazer."
            exit 0
          fi

          resposta=$(curl -sS -o corpo.json -w "%{http_code}" \
            -X POST "$APP_URL/api/manutencao/expurgo" \
            -H "Authorization: Bearer $MAINTENANCE_SECRET")

          echo "HTTP $resposta"
          cat corpo.json

          if [ "$resposta" != "200" ]; then
            echo "::error::O expurgo não foi executado."
            exit 1
          fi
